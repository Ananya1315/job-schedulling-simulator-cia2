apiVersion: apps/v1
kind: Deployment

metadata:
  name: job-scheduler-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: job-scheduler-backend

  template:
    metadata:
      labels:
        app: job-scheduler-backend

    spec:
      containers:
        - name: backend
          image: anu1315/job-scheduler-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
