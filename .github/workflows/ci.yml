
name: CI Build and Docker Hub Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  # ---------------- FRONTEND CI ----------------
  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test -- --watchAll=false

      - name: Build React App
        run: npm run build

  # ---------------- BACKEND CI ----------------
  backend-check:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run Backend Tests
        run: pytest

      - name: Verify FastAPI app
        run: python -c "from app.main import app; print('Backend OK')"

  # ---------------- GITLEAKS SECRET SCAN ----------------
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  # ---------------- DOCKER BUILD AND PUSH ----------------
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs: [frontend-build, backend-check, gitleaks]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            anu1315/job-scheduler-backend:latest
            anu1315/job-scheduler-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_API_URL=/api
          tags: |
            anu1315/job-scheduler-frontend:latest
            anu1315/job-scheduler-frontend:${{ github.sha }}

  # ---------------- DEPLOY TO GOOGLE KUBERNETES ENGINE ----------------
  deploy-to-gke:
    name: Deploy to Google Kubernetes Engine
    runs-on: ubuntu-latest

    needs: [docker-publish]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/924912222636/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-gke-deployer@job-scheduling-simulator-cia2.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: job-scheduler-cluster
          location: asia-south1
          project_id: job-scheduling-simulator-cia2

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update backend image
        run: |
          kubectl set image deployment/job-scheduler-backend \
            backend=anu1315/job-scheduler-backend:${{ github.sha }}

      - name: Update frontend image
        run: |
          kubectl set image deployment/job-scheduler-frontend \
            frontend=anu1315/job-scheduler-frontend:${{ github.sha }}

      - name: Verify backend deployment
        run: |
          kubectl rollout status deployment/job-scheduler-backend --timeout=180s

      - name: Verify frontend deployment
        run: |
          kubectl rollout status deployment/job-scheduler-frontend --timeout=180s

      - name: Show deployed resources
        run: |
          kubectl get pods
          kubectl get services
